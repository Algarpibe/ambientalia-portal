name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token de solo lectura (INFRA-004: evita GITHUB_TOKEN sobre-permisionado).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # INFRA-517 — actions pineadas por SHA (no por tag mutable). El comentario
      # documenta la versión. Actualizar SHA al subir de versión.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # El paquete privado @algarpibe/zoho-sync (hub-api) requiere NPM_TOKEN.
      # Añadir el secret NPM_TOKEN (PAT read:packages, ROTADO) en Settings →
      # Secrets and variables → Actions.
      - name: Install (npm ci)
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Typecheck (tsc -b) + bundle. El portal empaqueta todas las sub-apps,
      # así que su build las type-checkea; hub-api se compila aparte.
      - name: Build portal (typecheck + vite build)
        run: npm run build --workspace=apps/portal

      - name: Build hub-api (tsc)
        run: npm run build --workspace=apps/hub-api

      # Guard: ninguna app debe emitir .js/.jsx dentro de src/. Si aparece, es
      # que un tsconfig perdió `noEmit` (tsc -b escribiendo junto al .ts) o que
      # se commiteó salida compilada por error. Debe fallar el build.
      - name: Guard — sin .js emitido en src
        run: |
          found=$(find apps/*/src \( -name '*.js' -o -name '*.jsx' \) 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::Se encontraron .js/.jsx bajo apps/*/src (falta noEmit o salida compilada commiteada):"
            echo "$found"
            exit 1
          fi
          echo "OK: sin .js/.jsx bajo apps/*/src"

      # INFRA-516 — lint como gate bloqueante. Las apps con eslint.config.js deben
      # pasar con 0 errores (los warnings no bloquean; la deuda histórica benigna
      # —any de datos, const en case, set-state-in-effect— está degradada a warn).
      - name: Lint
        run: npm run lint --workspaces --if-present

      # Typecheck ESTRICTO de las sub-apps que lo pidan. No es redundante con los
      # builds de arriba: el del portal type-checkea las sub-apps porque las
      # importa por codigo fuente, pero con SU tsconfig, que relaja a proposito
      # `noUnusedLocals`, `noUnusedParameters` y `verbatimModuleSyntax`
      # (apps/portal/tsconfig.app.json los pone en false). Las sub-apps con un
      # tsconfig mas estricto lo tenian escrito y sin ejecutar: comprobado
      # metiendo una variable sin usar en apps/ausencias, que da TS6133 con su
      # propio tsconfig y pasa el build del portal sin una queja.
      #
      # `--workspaces --if-present` y no una ruta concreta: hoy solo `ausencias`
      # trae este script, y asi la que lo anada manana entra sola.
      - name: Typecheck estricto (sub-apps)
        run: npm run typecheck --workspaces --if-present

      # Tests de las apps que los tienen (hub-api, customer-valuation,
      # inventory-optimization). --if-present salta las que no.
      - name: Tests
        run: npm run test --workspaces --if-present

      # El CUARTO PORTÓN: ejecuta el SQL crudo de hub-api contra un PostgreSQL 17
      # de verdad, levantado con testcontainers (la misma versión mayor que corre
      # producción). Cubre los testigos de concurrencia de la app de ausencias, el
      # filtro del calendario y que las migraciones aplican limpias e idempotentes.
      #
      # Va en un step APARTE del de arriba, y no dentro de `npm run test`, a
      # propósito: el portón que corre en cada commit no debe poder fallar porque
      # un demonio de Docker esté parado en la máquina de alguien. Por eso
      # `vitest.config.ts` excluye los `*.db.test.ts` del run normal. Aquí, en
      # cambio, Docker siempre está, así que el candado se vigila solo en lugar de
      # depender de que alguien se acuerde de invocarlo a mano — que es la deuda
      # que estos tests vinieron a cerrar, un nivel más arriba.
      #
      # El timeout acota el caso de un registry lento: `contenedor.ts` ya trae su
      # propio `withStartupTimeout`, pero si algo se atasca fuera de él, mejor
      # fallar en 15 minutos que gastar el presupuesto del job entero.
      - name: Tests contra Postgres real (hub-api)
        run: npm run test:db --workspace=apps/hub-api
        timeout-minutes: 15

      # INFRA-516 — auditoría de dependencias de PRODUCCIÓN: bloquea el pipeline
      # ante vulnerabilidades CRÍTICAS. Las high/moderate (p. ej. xlsx, DEP-110)
      # quedan informativas hasta migrar; baja el --audit-level cuando se resuelvan.
      - name: npm audit (bloquea en críticas de prod)
        run: npm audit --omit=dev --audit-level=critical
