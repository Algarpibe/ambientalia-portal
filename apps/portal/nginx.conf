server {
    listen 80;
    server_name localhost;

    # INFRA-540 — sin la versión de nginx en la cabecera Server ni en las
    # páginas de error: anunciarla solo sirve para elegir qué CVE probar.
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;

        # INFRA-533 — index.html sin caché: tras un despliegue, un index.html
        # viejo apunta a chunks con hash que ya no existen y la app no carga
        # hasta recargar forzando. Va aquí y no en `location = /index.html`
        # porque las rutas de la SPA (/ausencias/...) las sirve este try_files
        # sin pasar por esa otra location. `no-cache` no es «no guardar»: el
        # navegador lo guarda y revalida con el ETag (un 304 si no cambió).
        # Los assets con hash siguen con caché larga en /assets/.
        add_header Cache-Control "no-cache" always;

        # INFRA-003 — headers de seguridad (seguros, no rompen la SPA).
        add_header X-Frame-Options "DENY" always;                       # anti-clickjacking
        add_header X-Content-Type-Options "nosniff" always;             # anti MIME-sniffing
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HTTPS forzado

        # SEC-234 — CSP en modo REPORT-ONLY: el navegador no bloquea nada, solo
        # avisa de lo que BLOQUEARÍA. Es el paso previo a la cabecera que bloquea:
        # activarla a ciegas puede dejar el portal en blanco por un host que nadie
        # apuntó. Cuando Sentry lleve unas semanas sin violaciones legítimas, se
        # cambia el nombre a `Content-Security-Policy` y listo.
        #
        # Hosts, uno por motivo:
        #  - api.ambientalia.cloud: hub-api, de donde sale todo.
        #  - www.datos.gov.co: laboratorios-ambientales consulta el IDEAM.
        #  - fonts.googleapis.com / fonts.gstatic.com: las fuentes de index.html.
        #  - o4511725706805248.ingest.us.sentry.io: Sentry, que manda los errores
        #    del frontend. La plantilla anterior no lo tenía: en enforcing habría
        #    bloqueado los propios informes de error.
        # Gemini (generativelanguage.googleapis.com) ya no está: nadie lo usa
        # (INFRA-539).
        #
        # Las violaciones van al endpoint de seguridad de Sentry. La clave de la
        # URL es la parte PÚBLICA del DSN —la misma que va dentro del bundle que
        # descarga cualquier navegador—, no un secreto. `report-to` + la cabecera
        # Reporting-Endpoints es el mecanismo nuevo (Chrome); `report-uri` cubre a
        # Firefox y Safari. Ojo: si cambia el proyecto o la clave de Sentry, hay que
        # cambiarla aquí también; nginx no ve VITE_SENTRY_DSN.
        #
        # `style-src 'unsafe-inline'`: los componentes usan `style=` en línea. No
        # afecta a los scripts, que siguen solo desde 'self'.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.ambientalia.cloud https://www.datos.gov.co https://o4511725706805248.ingest.us.sentry.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; report-uri https://o4511725706805248.ingest.us.sentry.io/api/4511725746716672/security/?sentry_key=05399b34b452a9cef0c72cb7bdb1f215; report-to csp" always;
        add_header Reporting-Endpoints 'csp="https://o4511725706805248.ingest.us.sentry.io/api/4511725746716672/security/?sentry_key=05399b34b452a9cef0c72cb7bdb1f215"' always;
    }

    # Cache-control + nosniff para los assets con hash.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
