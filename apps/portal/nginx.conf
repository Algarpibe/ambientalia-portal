server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;

        # INFRA-533 — index.html sin caché: tras un despliegue, un index.html
        # viejo apunta a chunks con hash que ya no existen y la app no carga
        # hasta recargar forzando. Va aquí y no en `location = /index.html`
        # porque las rutas de la SPA (/ausencias/...) las sirve este try_files
        # sin pasar por esa otra location. `no-cache` no es «no guardar»: el
        # navegador lo guarda y revalida con el ETag (un 304 si no cambió).
        # Los assets con hash siguen con caché larga en /assets/.
        add_header Cache-Control "no-cache" always;

        # INFRA-003 — headers de seguridad (seguros, no rompen la SPA).
        add_header X-Frame-Options "DENY" always;                       # anti-clickjacking
        add_header X-Content-Type-Options "nosniff" always;             # anti MIME-sniffing
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HTTPS forzado

        # CSP: pendiente de validar los hosts externos en vivo (hub-api, IDEAM,
        # fuentes, Gemini) antes de activarla en modo enforcing. Plantilla:
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.ambientalia.cloud https://www.datos.gov.co https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # Cache-control + nosniff para los assets con hash.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
